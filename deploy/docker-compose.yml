# BytePanel (byslab) — VPS dağıtımı.
# Sunucudaki diğer projelerden tamamen ayrıdır: kendi ağı, kendi veritabanı,
# kendi portları (sadece 127.0.0.1'e açılır). Dışarıya çıkış host nginx üzerinden olur.
#
#   panel.smsbenden.com  →  frontend (127.0.0.1:3100)
#   panel.smsbenden.com/api/v1  →  web → app (127.0.0.1:8090)

name: byslab

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Istanbul
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./php
    image: byslab-php
    restart: unless-stopped
    user: "82:82"          # www-data — storage ve bootstrap/cache bu kullanıcıya ait
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
    working_dir: /app

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ../backend:/app:ro
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8090:80"

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      TZ: Europe/Istanbul
    volumes:
      - ../frontend:/app
    command: npm run start
    ports:
      - "127.0.0.1:3100:3000"

  # Gece görevleri: risk anlık görüntüsü 23:50, anomali taraması 03:00
  scheduler:
    build: ./php
    image: byslab-php
    restart: unless-stopped
    user: "82:82"
    depends_on: [app]
    volumes:
      - ../backend:/app
    working_dir: /app
    command: php artisan schedule:work

  queue:
    build: ./php
    image: byslab-php
    restart: unless-stopped
    user: "82:82"
    depends_on: [app]
    volumes:
      - ../backend:/app
    working_dir: /app
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

volumes:
  db_data:
