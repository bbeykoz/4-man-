<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Bakım çalışması</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #fafafa; color: #18181b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    @media (prefers-color-scheme: dark) { body { background: #09090b; color: #fafafa; } }
    main { text-align: center; max-width: 30rem; }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: grid; place-items: center; color: #fff; font-weight: 700; letter-spacing: .5px;
    }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { margin: 0; color: #71717a; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="mark">BP</div>
    <h1>Bakım çalışması</h1>
    <p>Bu sayfa yapım aşamasında. Kısa süre içinde yayında olacak.</p>
  </main>
</body>
</html>
