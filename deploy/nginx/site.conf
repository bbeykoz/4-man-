# smsbenden.com — host nginx site dosyası.
# Konum: /etc/nginx/sites-available/smsbenden (sites-enabled'a symlink).
# Sertifika: certbot (--cert-name smsbenden.com), otomatik yenilenir.
# Sunucudaki diğer projelerin site dosyalarına (atomedia, bytepaneltest) dokunulmaz.

server {
    listen 80;
    server_name smsbenden.com panel.smsbenden.com market.smsbenden.com;

    # Sertifika yenilemesi HTTP üzerinden doğrulanır, yönlendirmeden muaf
    location /.well-known/acme-challenge/ { root /var/www/smsbenden-market; }

    location / { return 301 https://$host$request_uri; }
}

# Panel — Next.js arayüz + /api/v1 altında Laravel
server {
    listen 443 ssl;
    server_name panel.smsbenden.com;

    ssl_certificate     /etc/letsencrypt/live/smsbenden.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smsbenden.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Excel ve fiş yüklemeleri
    client_max_body_size 16m;

    # API — Laravel (php-fpm arkasındaki nginx konteyneri)
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Yüklenen dosyalar (kalite kontrol görselleri, fişler)
    location /storage/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# Market — tanıtım sayfası (Next.js /market yolu)
server {
    listen 443 ssl;
    server_name market.smsbenden.com;

    ssl_certificate     /etc/letsencrypt/live/smsbenden.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smsbenden.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Kök adres doğrudan tanıtım sayfasını açar, diğer yollar Next.js'e gider
    location = / {
        proxy_pass http://127.0.0.1:3100/market;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# Ana adres — içerik konulmadı, bakım sayfası duruyor
server {
    listen 443 ssl;
    server_name smsbenden.com;

    ssl_certificate     /etc/letsencrypt/live/smsbenden.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smsbenden.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/smsbenden-market;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
